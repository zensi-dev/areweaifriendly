name: Suggest a correction
description: A rating is wrong, or a project changed its policy.
title: 'Correction: '
labels: [correction]
body:
  - type: input
    id: project
    attributes:
      label: Project
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Quote the part of the policy that shows it, if you can.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the policy text that supports the correction.
