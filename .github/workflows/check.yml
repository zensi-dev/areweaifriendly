name: Weekly policy check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: policy-check

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - id: check
        run: bun scripts/check.ts
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_RESPONSE_FORMAT: ${{ secrets.AI_RESPONSE_FORMAT }}
          # Optional repository variables; empty means the script's defaults (20 minutes, 16 at a time).
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
          CHECK_CONCURRENCY: ${{ vars.CHECK_CONCURRENCY }}
          CHECK_REPORT: ${{ runner.temp }}/report.md
          CHECK_ISSUE: ${{ runner.temp }}/issue.md

      - run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests opened with GITHUB_TOKEN do not trigger the Validate workflow, so validate here.
      - if: steps.check.outputs.changed == 'true'
        run: bun run validate

      # One pull request, updated in place each week. Opened only when a rule or rating changed;
      # text-only refreshes ride along then. Closed when a later check finds nothing left to review.
      - name: Update pull request
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          branch="policy-check/weekly"
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ "$CHANGED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add data snapshots
            git commit -m "chore(data): policy check $(date -u +%F)"
            git push --force origin "$branch"
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --title "Policy check $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"
            else
              gh pr create --head "$branch" --title "Policy check $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$existing" ] && [ "$PROBLEMS" != true ]; then
            # Only when every project was checked: a failed check could hide a change still waiting here.
            gh pr close "$existing" --delete-branch --comment "The $(date -u +%F) check found nothing left to review."
          fi

      # An issue only for sources a person has to fix (gone or unreadable after retries); timeouts and
      # model failures are retried next week and only show in the run summary.
      - name: Report sources that need a person
        env:
          ATTENTION: ${{ steps.check.outputs.attention }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          title="Policy sources need attention"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$ATTENTION" = true ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$number" ] && [ "$PROBLEMS" != true ]; then
            gh issue close "$number" --comment "Every source read fine in the $(date -u +%F) check."
          fi
